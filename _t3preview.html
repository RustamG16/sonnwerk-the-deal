<!doctype html><html class="js" lang="de"><head><meta charset="utf-8"><style>/* ============================================================================
   Deal Room — tokens, base, shared components.   PHASE 0. Do not edit in 1–4.
   Skin: SONNWERK (brandspec.json + site/src/styles/global.css)
   Structure: apollo-instrument — density, drawn structure, semantic colour only.
   ========================================================================== */

:root {
  /* inherited verbatim from SONNWERK */
  --bg:        #0D1408;
  --paper:     #F2EBDC;
  --gold:      #E8A33D;
  --gold-dim:  #654D1D;
  --cream-dim: rgba(242, 235, 220, 0.64);
  --cream-dimmer: rgba(242, 235, 220, 0.42);
  --line:      rgba(242, 235, 220, 0.16);
  --serif:     'Fraunces', Georgia, serif;
  --sans:      'Space Grotesk', system-ui, -apple-system, sans-serif;
  --mono:      ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace;
  --spring:    cubic-bezier(0.2, 0.9, 0.2, 1);

  /* surfaces — a tool needs layering a marketing site does not */
  --surface-1: #131C0D;
  --surface-2: #1A250F;
  --surface-3: #212E14;
  --line-soft: rgba(242, 235, 220, 0.08);

  /* the ENTIRE semantic palette. Each is a named state or it does not exist. */
  --accepted:  #7FA05A;
  --countered: #E8A33D;
  --open:      rgba(242, 235, 220, 0.40);
  --blocked:   #C4623D;

  /* type scale — tightened for document density */
  --t-display: clamp(1.9rem, 3.2vw, 2.6rem);
  --t-h2:      clamp(1.3rem, 2vw, 1.6rem);
  --t-h3:      1.05rem;
  --t-body:    0.95rem;
  --t-small:   0.82rem;
  --t-label:   0.69rem;
  --t-num:     clamp(1.6rem, 2.6vw, 2.2rem);
  --t-num-sm:  1.15rem;

  --row:       32px;
  --row-c:     26px;
  --pad:       clamp(16px, 2.5vw, 28px);
  --edge:      clamp(16px, 3vw, 48px);
  --gap:       clamp(12px, 1.6vw, 20px);
  --radius:    2px;
  --dur:       140ms;
  --dur-fast:  120ms;
  --maxw:      1480px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* A class that sets `display` beats the UA stylesheet's `[hidden]{display:none}`. That
   silently un-hides tab panels, notices and the internal-build pill. Settle it once. */
[hidden] { display: none !important; }

html { -webkit-text-size-adjust: 100%; }

body {
  background: var(--bg);
  color: var(--paper);
  font-family: var(--sans);
  font-size: var(--t-body);
  line-height: 1.55;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

img, svg, canvas { display: block; max-width: 100%; }
a { color: var(--gold); text-decoration: none; border-bottom: 1px solid var(--gold-dim); }
a:hover { border-bottom-color: var(--gold); }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; }
input, textarea, select { font: inherit; color: inherit; }

h1, h2, h3, h4 { font-family: var(--serif); font-weight: 500; line-height: 1.14; letter-spacing: -0.01em; }
h2 { font-size: var(--t-h2); }
h3 { font-size: var(--t-h3); }

:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.vh {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
}

.skip-link {
  position: absolute; top: -100%; left: var(--edge); z-index: 200;
  background: var(--gold); color: var(--bg); padding: 0.7rem 1.2rem;
  font-size: var(--t-small); letter-spacing: 0.06em; border: 0;
}
.skip-link:focus { top: 8px; }

/* ---------------------------------------------------------------- header -- */

.hdr {
  position: sticky; top: 0; z-index: 60;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
  padding: clamp(14px, 2vw, 22px) var(--edge) 0;
}

.hdr__top {
  display: flex; flex-wrap: wrap; align-items: flex-start;
  gap: var(--gap); max-width: var(--maxw); margin: 0 auto;
}
.hdr__id { flex: 1 1 320px; min-width: 0; }
.hdr__title { font-size: var(--t-display); margin-top: 0.15em; }
.hdr__sub { color: var(--cream-dim); font-size: var(--t-small); margin-top: 0.35em; }

.hdr__meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.hdr__date { font-size: var(--t-small); color: var(--cream-dim); }

.hdr__actions { display: flex; gap: 8px; flex-wrap: wrap; }

.pill {
  display: inline-block; padding: 3px 10px; border: 1px solid var(--line);
  border-radius: var(--radius); font-size: var(--t-label);
  letter-spacing: 0.1em; text-transform: uppercase; color: var(--cream-dim);
}
.pill--internal { border-color: var(--blocked); color: var(--blocked); }

.hdr__progress {
  max-width: var(--maxw); margin: 0 auto; padding: 12px 0 4px;
  display: flex; align-items: center; gap: var(--gap); flex-wrap: wrap;
}
.prog { display: flex; align-items: center; gap: 10px; flex: 1 1 300px; min-width: 0; }
.prog__track {
  flex: 1 1 auto; height: 3px; background: var(--line-soft);
  border-radius: 0; min-width: 80px; overflow: hidden;
}
.prog__fill {
  height: 100%; background: var(--gold);
  transition: width var(--dur) var(--spring);
}
.prog__text { font-size: var(--t-small); color: var(--cream-dim); white-space: nowrap; }

.hdr__notice { font-size: var(--t-small); color: var(--gold); }
.linkbtn { color: var(--cream-dim); border-bottom: 1px solid var(--line); font-size: inherit; }
.linkbtn:hover { color: var(--paper); border-bottom-color: var(--paper); }

/* ------------------------------------------------------------------ tabs -- */

.tabs { max-width: var(--maxw); margin: 0 auto; }
.tabs__list {
  display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none;
  margin-bottom: -1px;
}
.tabs__list::-webkit-scrollbar { display: none; }

.tabs__t {
  display: inline-flex; align-items: baseline; gap: 8px; white-space: nowrap;
  padding: 10px 16px; border: 1px solid transparent; border-bottom: 0;
  color: var(--cream-dim); font-size: var(--t-small); letter-spacing: 0.02em;
  border-radius: var(--radius) var(--radius) 0 0;
  transition: color var(--dur-fast) ease, background var(--dur-fast) ease;
}
.tabs__t:hover { color: var(--paper); background: var(--surface-1); }
.tabs__t[aria-selected="true"] {
  color: var(--paper); background: var(--surface-2);
  border-color: var(--line); border-bottom-color: var(--surface-2);
  box-shadow: inset 0 2px 0 var(--gold);
}
.tabs__n { font-size: var(--t-label); letter-spacing: 0.16em; color: var(--gold); }
.tabs__t[aria-selected="false"] .tabs__n { color: var(--cream-dimmer); }
.tabs__t--star[aria-selected="false"] .tabs__n { color: var(--gold); }
.tabs__t--internal { color: var(--blocked); }
.tabs__t--internal .tabs__n { color: var(--blocked); }

/* ------------------------------------------------------------------ main -- */

.main { max-width: var(--maxw); margin: 0 auto; padding: 0 var(--edge); }

.panelview {
  padding: clamp(20px, 3vw, 36px) 0 clamp(40px, 6vw, 80px);
  animation: fade var(--dur-fast) ease;
}
.panelview:focus { outline: none; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

.foot {
  max-width: var(--maxw); margin: 0 auto;
  padding: 20px var(--edge) 48px; border-top: 1px solid var(--line);
  display: grid; gap: 8px;
}

/* ------------------------------------------------------- shared: layout -- */

.stack   { display: grid; gap: var(--gap); }
.stack-l { display: grid; gap: calc(var(--gap) * 2); }
.cols-2  { display: grid; gap: var(--gap); grid-template-columns: 1fr; }
.cols-3  { display: grid; gap: var(--gap); grid-template-columns: 1fr; }
.cols-4  { display: grid; gap: var(--gap); grid-template-columns: repeat(2, 1fr); }
@media (min-width: 760px)  { .cols-2 { grid-template-columns: 1fr 1fr; }
                             .cols-3 { grid-template-columns: repeat(3, 1fr); }
                             .cols-4 { grid-template-columns: repeat(4, 1fr); } }
@media (min-width: 1100px) { .cols-2--wide { grid-template-columns: 1.35fr 1fr; } }

.scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.scroll-x:focus-visible { outline-offset: -2px; }

/* ---------------------------------------------------- shared: components -- */

.eyebrow {
  font-size: var(--t-label); letter-spacing: 0.28em; text-transform: uppercase;
  color: var(--gold); font-weight: 500;
}
.section-num { font-size: var(--t-label); letter-spacing: 0.24em; color: var(--gold); margin-right: 0.7em; }
.label {
  font-size: var(--t-label); letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--cream-dim); font-weight: 500;
}
.mono { font-family: var(--mono); font-size: 0.78rem; color: var(--cream-dim); }
.dim  { color: var(--cream-dim); }
.gold { color: var(--gold); }

.sh { max-width: 78ch; margin-bottom: var(--gap); }
.sh__title { font-size: var(--t-h2); margin: 0.25em 0 0; }
.sh__lead  { color: var(--cream-dim); margin-top: 0.5em; }

.panel {
  background: var(--surface-1);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: var(--pad);
}
.panel--raised { background: var(--surface-2); }
.panel--flush  { padding: 0; }
.panel--gold   { border-color: var(--gold); }

.panel__head {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 12px; flex-wrap: wrap; margin-bottom: 14px;
  padding-bottom: 10px; border-bottom: 1px solid var(--line-soft);
}
.panel--flush .panel__head { padding: var(--pad) var(--pad) 10px; margin-bottom: 0; }
.panel__title { font-size: var(--t-h3); font-family: var(--serif); }
.panel__meta  { font-size: var(--t-small); color: var(--cream-dim); }

/* figures */
.num { font-variant-numeric: tabular-nums; }
td.num, th.num { text-align: right; }

.stat { display: grid; gap: 2px; align-content: start; }
.stat__n {
  font-size: var(--t-num); font-family: var(--serif); line-height: 1;
  font-variant-numeric: tabular-nums; letter-spacing: -0.015em;
}
.stat__n--sm { font-size: var(--t-num-sm); }
.stat__n--gold { color: var(--gold); }
.stat__l { font-size: var(--t-small); color: var(--cream-dim); }
.stat__u { font-size: var(--t-label); letter-spacing: 0.08em; color: var(--cream-dimmer); text-transform: uppercase; }

/* tables — the default container. Cards waste edges. */
.dtable { width: 100%; border-collapse: collapse; font-size: var(--t-small); }
.dtable caption { text-align: left; }
.dtable thead th {
  position: sticky; top: 0; z-index: 2;
  background: var(--surface-2);
  font-size: var(--t-label); letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--cream-dim); font-weight: 500; text-align: left;
  padding: 8px 12px; white-space: nowrap;
  border-bottom: 1px solid var(--line);
}
.dtable tbody td, .dtable tbody th {
  padding: 0 12px; height: var(--row);
  border-bottom: 1px solid var(--line-soft);
  text-align: left; font-weight: 400; vertical-align: middle;
}
.dtable tbody th { color: var(--paper); }
.dtable tbody tr:hover { background: var(--surface-2); }
.dtable tbody tr.is-total td, .dtable tbody tr.is-total th {
  border-top: 1px solid var(--line); border-bottom: 0;
  font-weight: 500; background: var(--surface-2);
}
.dtable--compact tbody td, .dtable--compact tbody th { height: var(--row-c); }
.dtable td.wrap, .dtable th.wrap { white-space: normal; min-width: 18ch; }

/* chips — colour never travels alone */
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 2px 9px; border: 1px solid currentColor; border-radius: var(--radius);
  font-size: var(--t-label); letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--open); white-space: nowrap;
  transition: color var(--dur-fast) ease, border-color var(--dur-fast) ease;
}
.chip::before {
  content: ''; width: 6px; height: 6px; background: currentColor; flex: none;
}
.chip--accepted  { color: var(--accepted); }
.chip--countered { color: var(--countered); }
.chip--open      { color: var(--open); }
.chip--proposed  { color: var(--cream-dim); }
.chip--blocked   { color: var(--blocked); }

.legend { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.legend__i { display: inline-flex; align-items: center; gap: 7px; font-size: var(--t-small); color: var(--cream-dim); }
.legend__s { width: 9px; height: 9px; flex: none; }

/* buttons — SONNWERK's rectangle, thin gold border */
.btn {
  display: inline-block; padding: 0.65rem 1.4rem;
  border: 1px solid var(--gold); background: transparent; color: var(--paper);
  font-size: var(--t-small); letter-spacing: 0.12em; text-transform: uppercase;
  border-radius: var(--radius);
  transition: background var(--dur) var(--spring), color var(--dur) var(--spring);
}
.btn:hover { background: var(--gold); color: var(--bg); }
.btn--sm { padding: 0.4rem 0.85rem; font-size: var(--t-label); letter-spacing: 0.1em; }
.btn--solid { background: var(--gold); color: var(--bg); }
.btn--solid:hover { background: transparent; color: var(--paper); }
.btn--quiet { border-color: var(--line); }
.btn--quiet:hover { background: var(--surface-3); color: var(--paper); border-color: var(--paper); }
.btn--file { cursor: pointer; }
.btn[aria-pressed="true"] { background: var(--gold); color: var(--bg); }

/* segmented control */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.seg__b {
  padding: 0.45rem 0.9rem; font-size: var(--t-small); color: var(--cream-dim);
  border-right: 1px solid var(--line);
  transition: background var(--dur-fast) ease, color var(--dur-fast) ease;
}
.seg__b:last-child { border-right: 0; }
.seg__b:hover { background: var(--surface-3); color: var(--paper); }
.seg__b[aria-pressed="true"] { background: var(--gold); color: var(--bg); }

/* disclosure */
.expander { border-bottom: 1px solid var(--line-soft); }
.expander__btn {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  padding: 9px 0; color: inherit;
}
.expander__btn::after {
  content: '+'; margin-left: auto; color: var(--gold);
  font-size: 1rem; line-height: 1; transition: transform var(--dur) var(--spring);
}
.expander__btn[aria-expanded="true"]::after { content: '−'; }
/* The 0fr→1fr grid trick cannot work here: `overflow:hidden` on the item is what lets the
   0fr row reach zero, and it is also what stops the item contributing anything to the 1fr
   track — so the panel collapses correctly and then expands to nothing. Measured in the
   browser, all three variants fail. A disclosure reveals with opacity instead, which is
   what apollo-instrument asks for anyway: feedback only, opacity and 2px, under 150 ms. */
.expander__btn[aria-expanded="false"] + .expander__body { display: none; }
.expander__body .inner { padding: 0 0 12px; color: var(--cream-dim); font-size: var(--t-small); }
.expander__btn[aria-expanded="true"] + .expander__body .inner { animation: expand var(--dur) ease-out; }
@keyframes expand {
  from { opacity: 0; transform: translateY(-2px); }
  to   { opacity: 1; transform: none; }
}
/* Without JS every disclosure is open — the page is a complete document first. */
html:not(.js) .expander__body { display: block !important; }

/* callouts */
.note { font-size: var(--t-small); color: var(--cream-dim); }
.warn {
  border-left: 2px solid var(--blocked); background: rgba(196, 98, 61, 0.07);
  padding: 10px 14px; font-size: var(--t-small);
}
.warn strong { color: var(--blocked); }
.good {
  border-left: 2px solid var(--accepted); background: rgba(127, 160, 90, 0.07);
  padding: 10px 14px; font-size: var(--t-small);
}
.quote {
  font-family: var(--serif); font-size: clamp(1.05rem, 1.7vw, 1.35rem);
  line-height: 1.4; border-left: 2px solid var(--gold); padding-left: var(--gap);
  color: var(--paper);
}

/* text inputs */
.field {
  width: 100%; background: var(--bg); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 7px 10px; font-size: var(--t-small);
  color: var(--paper);
}
.field::placeholder { color: var(--cream-dimmer); }
.field:focus-visible { border-color: var(--gold); }

/* ------------------------------------------------------------- no-script -- */
/* The page is a complete document before it is a tool. */
html:not(.js) .panelview[hidden] { display: block !important; }
html:not(.js) .tabs { display: none; }
html:not(.js) .hdr__actions, html:not(.js) .hdr__progress { display: none; }
html:not(.js) .panelview { border-top: 1px solid var(--line); }

/* -------------------------------------------------------- reduced motion -- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}

/* ----------------------------------------------------------------- print -- */
@media print {
  .hdr__actions, .tabs, .skip-link { display: none; }
  .panelview[hidden] { display: block !important; }
  body { background: #fff; color: #111; }
  .panel { border-color: #ccc; background: #fff; }
}
/* ---- Tab 03 · Plan & Lücken -------------------------------------------
   Colour appears on the gates and on the severity/state chips. Nothing else
   in this tab is coloured: the flow line, the stage boxes, their contents and
   every rule are --line / --cream-dim.
   ---------------------------------------------------------------------- */

/* semantic swatches — the only place these hues are named */
.t3-sw--blocked   { background: var(--blocked); }
.t3-sw--countered { background: var(--countered); }
.t3-sw--accepted  { background: var(--accepted); }
.t3-sw--open      { background: var(--open); }
.t3-sw--line      { background: var(--line); outline: 1px solid var(--line); }

/* ------------------------------------------------------ B · flow diagram -- */

.t3-flow__body { padding: 0 var(--pad) var(--pad); }

.t3-flow__legend {
  padding: 10px 0 12px;
  border-bottom: 1px solid var(--line-soft);
}

.t3-flow__canvas { margin-top: 14px; }
.t3-flow__canvas svg { width: 100%; height: auto; overflow: visible; }

.t3-flow__hint {
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--line-soft);
}

/* the text alternative. Hidden when the diagram is drawn, the whole content
   when it is not — JS off, or CSS off. */
.t3-flow__alt { display: grid; gap: 10px; padding-left: 1.4em; }
.t3-flow__alt li { color: var(--cream-dim); font-size: var(--t-small); }
.t3-flow__alt strong { color: var(--paper); font-weight: 500; }

html:not(.js) .t3-flow__canvas,
html:not(.js) .t3-flow__hint,
html:not(.js) .t3-flow__legend { display: none; }
html:not(.js) .t3-flow__alt {
  position: static; width: auto; height: auto; overflow: visible;
  clip: auto; clip-path: none; white-space: normal;
}

/* ---- SVG: the neutral layer ---- */

.t3-d-line { stroke: var(--cream-dimmer); stroke-width: 1; fill: none; }
.t3-d-rule { stroke: var(--line); stroke-width: 1; fill: none; }
.t3-d-box  { fill: var(--surface-2); stroke: var(--line); stroke-width: 1; }
.t3-d-num  { fill: var(--gold); font-size: 8.5px; letter-spacing: 0.16em; font-weight: 500; }
.t3-d-name { fill: var(--paper); font-size: 12.5px; font-weight: 500; }
.t3-d-meta { fill: var(--cream-dimmer); font-size: 9.5px; letter-spacing: 0.06em; text-transform: uppercase; }
.t3-d-item { fill: var(--cream-dim); font-size: 10.5px; }
.t3-d-mark { fill: var(--cream-dimmer); }
.t3-d-outl { fill: var(--cream-dimmer); font-size: 8.5px; letter-spacing: 0.16em; text-transform: uppercase; }
.t3-d-out  { fill: var(--paper); font-size: 10.5px; }

.t3-flow__canvas text {
  font-family: var(--sans);
  font-variant-numeric: tabular-nums;
}

/* ---- SVG: the gates. The only colour in the diagram. ---- */

.t3-gate { cursor: pointer; outline: none; }
.t3-gate--blocked   { color: var(--blocked); }
.t3-gate--countered { color: var(--countered); }
.t3-gate--accepted  { color: var(--accepted); }

.t3-gate__bar  { stroke: currentColor; stroke-width: 2; }
.t3-gate--crit .t3-gate__bar { stroke-width: 3; }
.t3-gate__stem { stroke: currentColor; stroke-width: 1; fill: none; opacity: 0.55; }

.t3-gate__chip { fill: var(--bg); stroke: currentColor; stroke-width: 1; }
.t3-gate--crit .t3-gate__chip { stroke-width: 2; }
.t3-gate__cn { fill: currentColor; font-size: 10px; font-weight: 700; }
.t3-gate__cs { fill: currentColor; font-size: 8.5px; letter-spacing: 0.1em; text-transform: uppercase; }

.t3-gate__fr { fill: none; stroke: var(--gold); stroke-width: 2; opacity: 0; }
.t3-gate:focus .t3-gate__fr,
.t3-gate:focus-visible .t3-gate__fr { opacity: 1; }

.t3-gate__tip { opacity: 0; pointer-events: none; transition: opacity var(--dur-fast) ease; }
.t3-gate:hover .t3-gate__tip,
.t3-gate:focus .t3-gate__tip,
.t3-gate:focus-visible .t3-gate__tip { opacity: 1; }

.t3-gate__tipbg { fill: var(--surface-3); stroke: currentColor; stroke-width: 1; }
.t3-gate__tipk  { fill: currentColor; font-size: 8.5px; letter-spacing: 0.1em; text-transform: uppercase; }
.t3-gate__tipt  { fill: var(--paper); font-size: 10.5px; }
.t3-gate__tipm  { fill: var(--cream-dim); font-size: 9.5px; }

/* ------------------------------------------------------- flowCosts panel -- */

.t3-costs__note { font-size: var(--t-small); color: var(--cream-dim); margin-top: 8px; max-width: 92ch; }
.t3-costs__why  { font-size: 1.02rem; margin-top: 14px; max-width: 76ch; }

/* ---------------------------------------------------------- C · Umfang --- */

.t3-scope__note {
  padding: 12px var(--pad) var(--pad);
  border-top: 1px solid var(--line-soft);
  max-width: 92ch;
}
.t3-scope__risk td { height: auto !important; padding: 0 12px 10px !important; border-bottom: 1px solid var(--line-soft); }
.t3-scope__risk .warn { font-size: var(--t-label); letter-spacing: 0.02em; text-transform: none; }

/* ---------------------------------------------------------- C · Lücken --- */

.t3-gaps__wrap { padding: 0 var(--pad) var(--pad); }
.t3-gaps__legend { padding: 10px 0 12px; border-bottom: 1px solid var(--line-soft); }

.t3-gaps { list-style: none; display: grid; }
.t3-gaps__r {
  display: grid;
  grid-template-columns: 2.6em 1fr;
  gap: 4px 12px;
  align-items: start;
  padding: 10px 0;
  border-bottom: 1px solid var(--line-soft);
}
.t3-gaps__r:last-child { border-bottom: 0; }
.t3-gaps__n { font-size: var(--t-label); letter-spacing: 0.14em; color: var(--gold); padding-top: 3px; }
.t3-gaps__c { min-width: 0; }
.t3-gaps__t { font-size: var(--t-small); font-weight: 500; }
.t3-gaps__d { font-size: var(--t-small); color: var(--cream-dim); margin-top: 2px; }
.t3-gaps__r .chip { grid-column: 2; justify-self: start; margin-top: 2px; }

@media (min-width: 760px) {
  .t3-gaps__r { grid-template-columns: 2.6em 1fr 9.5em; align-items: baseline; }
  .t3-gaps__r .chip { grid-column: 3; justify-self: end; margin-top: 0; }
}

/* ------------------------------------------------------- D · Hanf-Exhibit -- */

.t3-ads__body { padding: 0 var(--pad) var(--pad); display: grid; gap: var(--gap); }
.t3-ads__p { font-size: var(--t-small); color: var(--cream-dim); max-width: 88ch; padding-top: 4px; }

.t3-ex { display: grid; gap: var(--gap); }
@media (min-width: 860px) { .t3-ex { grid-template-columns: 1fr 1fr; } }

.t3-ex__set { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; }
.t3-ex__h { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 12px; }
.t3-ex__hl { font-size: var(--t-label); letter-spacing: 0.1em; text-transform: uppercase; color: var(--cream-dim); }

.t3-ex__grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.t3-ex__f { min-width: 0; }
.t3-ex__img {
  width: 100%; max-width: 240px; height: auto; aspect-ratio: 3 / 2; object-fit: cover;
  border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-2);
}
.t3-ex__c { display: grid; gap: 2px; margin-top: 7px; max-width: 240px; }
.t3-ex__cap { font-size: var(--t-label); color: var(--cream-dim); }
.t3-ex__v {
  font-size: var(--t-label); letter-spacing: 0.08em; text-transform: uppercase; font-weight: 500;
  border-top: 2px solid currentColor; padding-top: 4px;
}
.t3-ex__v--bad  { color: var(--blocked); }
.t3-ex__v--good { color: var(--accepted); }

.t3-ads__pol { border: 1px solid var(--line); border-radius: var(--radius); }

.t3-ads__kicker {
  font-family: var(--serif);
  font-size: clamp(1.02rem, 1.5vw, 1.22rem);
  line-height: 1.35;
  max-width: 62ch;
  border-left: 2px solid var(--gold);
  padding-left: var(--gap);
}

.t3-ads__close {
  display: grid; gap: var(--gap);
  padding-top: 12px; border-top: 1px solid var(--line-soft);
}
@media (min-width: 760px) { .t3-ads__close { grid-template-columns: 1fr 1fr; } }
.t3-ads__q { font-size: var(--t-small); color: var(--cream-dim); margin-top: 6px; }

/* --------------------------------------------------- E · Was noch fehlt --- */

.dtable tbody tr.t3-oi__grp th {
  height: var(--row-c) !important;
  background: var(--surface-2);
  font-size: var(--t-label); letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--cream-dim); font-weight: 500;
  border-top: 1px solid var(--line) !important;
  border-bottom: 1px solid var(--line) !important;
}

.t3-oi__row.is-crit th, .t3-oi__row.is-crit td { font-weight: 500; }
.t3-oi__row.is-crit .t3-oi__q { color: var(--paper); }
.t3-oi__row.is-crit > th:first-child {
  box-shadow: inset 2px 0 0 var(--blocked);
}

.t3-oi__row.is-target, .t3-oi__row.is-target + .t3-oi__det > td {
  background: var(--surface-3);
  transition: background var(--dur) ease;
}

.t3-oi__btn {
  padding: 0; min-height: var(--row);
  font-size: var(--t-small); gap: 12px; white-space: normal;
}
.t3-oi__q { color: var(--cream-dim); }

.t3-oi__det[hidden] { display: none; }
.t3-oi__det > td {
  height: auto !important;
  padding: 0 12px 12px !important;
  border-bottom: 1px solid var(--line-soft);
}
.t3-oi__dl { display: grid; gap: 8px; max-width: 92ch; font-size: var(--t-small); }
.t3-oi__dt { font-size: var(--t-label); letter-spacing: 0.1em; text-transform: uppercase; color: var(--cream-dimmer); }
.t3-oi__dd { color: var(--cream-dim); margin-top: 1px; }

.t3-oi__warn { margin: 12px var(--pad) var(--pad); }
